<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring with gradient -->
  <defs>
    <linearGradient id="outerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="70" cy="70" r="68" fill="url(#outerGradient)" stroke="#164e63" stroke-width="2"/>
  
  <!-- Inner decorative circle -->
  <circle cx="70" cy="70" r="52" fill="url(#innerGradient)" stroke="#92400e" stroke-width="1"/>
  
  <!-- Agricultural elements - Stylized leaves/crops -->
  <path d="M45 50 Q50 45 55 50 Q60 45 65 50 Q70 45 75 50 Q80 45 85 50 Q90 45 95 50" 
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M45 62 Q50 57 55 62 Q60 57 65 62 Q70 57 75 62 Q80 57 85 62 Q90 57 95 62" 
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M45 74 Q50 69 55 74 Q60 69 65 74 Q70 69 75 74 Q80 69 85 74 Q90 69 95 74" 
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M45 86 Q50 81 55 86 Q60 81 65 86 Q70 81 75 86 Q80 81 85 86 Q90 81 95 86" 
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Central circle for emphasis -->
  <circle cx="70" cy="70" r="12" fill="url(#centerGradient)" stroke="#0e7490" stroke-width="2"/>
  
  <!-- Small agricultural symbol in center -->
  <path d="M65 65 L70 60 L75 65 L70 75 Z" fill="#0e7490"/>
  <circle cx="70" cy="68" r="2" fill="#f59e0b"/>
  
  <!-- Top text -->
  <text x="70" y="25" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">INSTITUT SUPÉRIEUR</text>
  <text x="70" y="38" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="9" font-weight="normal">D'ENSEIGNEMENT APPLIQUÉ</text>
  
  <!-- Bottom text -->
  <text x="70" y="115" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ISEAV</text>
  <text x="70" y="130" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">WALUNGU</text>
</svg>