<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for better visual appeal -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Shield background -->
  <path d="M60 10 C30 10, 15 25, 15 50 C15 85, 40 105, 60 110 C80 105, 105 85, 105 50 C105 25, 90 10, 60 10 Z" 
        fill="white" stroke="#374151" stroke-width="2"/>
  
  <!-- Top left quadrant - Stars (Education/Excellence) -->
  <path d="M15 50 L60 50 L60 10 C30 10, 15 25, 15 50 Z" fill="url(#blueGrad)"/>
  <!-- Stars -->
  <g fill="#fbbf24">
    <polygon points="35,25 37,31 43,31 38,35 40,41 35,37 30,41 32,35 27,31 33,31" transform="scale(0.6)"/>
    <polygon points="45,20 46,24 50,24 47,27 48,31 45,29 42,31 43,27 40,24 44,24" transform="scale(0.6)"/>
    <polygon points="55,25 57,31 63,31 58,35 60,41 55,37 50,41 52,35 47,31 53,31" transform="scale(0.6)"/>
  </g>
  
  <!-- Top right quadrant - Cow (Veterinary) -->
  <path d="M60 10 C90 10, 105 25, 105 50 L60 50 L60 10 Z" fill="url(#greenGrad)"/>
  <!-- Simplified cow -->
  <g fill="white">
    <ellipse cx="82" cy="35" rx="12" ry="8"/>
    <rect x="75" y="28" width="4" height="6" rx="2"/>
    <rect x="89" y="28" width="4" height="6" rx="2"/>
    <circle cx="79" cy="32" r="1" fill="#374151"/>
    <circle cx="85" cy="32" r="1" fill="#374151"/>
    <path d="M82 34 Q80 36 82 37 Q84 36 82 34"/>
  </g>
  
  <!-- Bottom left quadrant - Book (Knowledge) -->
  <path d="M15 50 C15 85, 40 105, 60 110 L60 50 L15 50 Z" fill="url(#brownGrad)"/>
  <!-- Open book -->
  <g fill="white">
    <path d="M25 65 Q35 60 45 65 Q45 75 45 80 Q35 85 25 80 Q25 75 25 65 Z"/>
    <path d="M45 65 Q55 60 65 65 Q65 75 65 80 Q55 85 45 80 Q45 75 45 65 Z"/>
    <line x1="30" y1="70" x2="40" y2="68" stroke="#374151" stroke-width="1"/>
    <line x1="30" y1="75" x2="40" y2="73" stroke="#374151" stroke-width="1"/>
    <line x1="50" y1="68" x2="60" y2="70" stroke="#374151" stroke-width="1"/>
    <line x1="50" y1="73" x2="60" y2="75" stroke="#374151" stroke-width="1"/>
  </g>
  
  <!-- Bottom right quadrant - Palm tree and waves (Agriculture/Environment) -->
  <path d="M60 50 L60 110 C80 105, 105 85, 105 50 L60 50 Z" fill="url(#aquaGrad)"/>
  <!-- Palm frond -->
  <g fill="#22c55e">
    <path d="M85 65 Q90 60 95 65 Q90 70 85 65"/>
    <path d="M85 65 Q80 60 75 65 Q80 70 85 65"/>
    <path d="M85 65 Q85 55 85 50 Q85 55 85 65"/>
  </g>
  <!-- Waves -->
  <g fill="white" opacity="0.8">
    <path d="M70 85 Q75 83 80 85 Q85 87 90 85 Q95 83 100 85"/>
    <path d="M70 90 Q75 88 80 90 Q85 92 90 90 Q95 88 100 90"/>
  </g>
  
  <!-- Center dividing lines -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#374151" stroke-width="1" opacity="0.3"/>
  <line x1="15" y1="50" x2="105" y2="50" stroke="#374151" stroke-width="1" opacity="0.3"/>
  
  <!-- Institute text at bottom -->
  <text x="60" y="125" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="8" font-weight="bold">ISEAV WALUNGU</text>
</svg>